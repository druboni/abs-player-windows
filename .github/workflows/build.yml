# Tests every push and pull request, and builds the installer.
# Pushing a tag like v0.2.0 also attaches the installer to a GitHub release for that tag.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The real audio engine tests need Media Foundation, which build machines may not have.
      - name: Test
        run: dotnet test tests/AbsPlayer.Core.Tests -c Release --filter "Category!=Audio"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --title "ABS Player $($tag.TrimStart('v'))" --generate-notes }
          gh release upload $tag (Get-Item installer/Output/*.exe).FullName --clobber
